<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis Perangkat Baru — VoltSense</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f6f9;
            color: #1e293b;
        }
        .form-card {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 0.6rem 0.9rem;
            border: 1px solid #cbd5e1;
        }
        .form-control:focus, .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 760px;">
        <div class="mb-4 d-flex align-items-center justify-content-between">
            <div>
                <h3 class="fw-bold mb-1">Analisis Kesehatan Baterai</h3>
                <p class="text-muted mb-0 small">Masukkan parameter penggunaan laptop untuk diprediksi oleh model Machine Learning.</p>
            </div>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary" style="border-radius: 10px;">
                <i class="bi bi-arrow-left me-1"></i> Kembali
            </a>
        </div>

        <div class="card form-card p-4 p-md-5">
            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Device ID</label>
                        <input type="text" name="device_id" class="form-control" placeholder="Contoh: LB051" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Brand Laptop</label>
                        <input type="text" name="brand" class="form-control" placeholder="Contoh: Asus, Lenovo, Apple" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tahun Rilis</label>
                        <input type="number" name="model_year" class="form-control" placeholder="2022" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Sistem Operasi (OS)</label>
                        <select name="os" class="form-select">
                            <option value="Windows">Windows</option>
                            <option value="macOS">macOS</option>
                            <option value="Linux">Linux</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tipe Penggunaan</label>
                        <select name="usage_type" class="form-select">
                            <option value="Office">Office</option>
                            <option value="Programming">Programming</option>
                            <option value="Gaming">Gaming</option>
                            <option value="Creative">Creative</option>
                            <option value="Student">Student</option>
                        </select>
                    </div>

                    <hr class="my-3 text-muted">

                    <div class="col-md-6">
                        <label class="form-label">Charging Cycles (Siklus Pengisian)</label>
                        <input type="number" name="charging_cycles" class="form-control" placeholder="Contoh: 450" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Usia Baterai (Bulan)</label>
                        <input type="number" name="battery_age_months" class="form-control" placeholder="Contoh: 24" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Penggunaan Harian (Jam)</label>
                        <input type="number" name="daily_usage_hours" class="form-control" placeholder="Contoh: 7" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Rata-rata Charge Limit (%)</label>
                        <input type="number" name="avg_charge_limit_percent" class="form-control" placeholder="Contoh: 85" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Battery Health Saat Ini (%)</label>
                        <input type="number" name="battery_health_percent" class="form-control" placeholder="Contoh: 88" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Masalah Overheating?</label>
                        <select name="overheating_issues" class="form-select">
                            <option value="No">No (Normal)</option>
                            <option value="Yes">Yes (Sering Panas)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Rating Performa (1 - 5)</label>
                        <input type="number" name="performance_rating" min="1" max="5" class="form-control" placeholder="4" required>
                    </div>
                </div>

                <div class="mt-4 pt-2">
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="border-radius: 12px; background-color: #2563eb;">
                        <i class="bi bi-cpu me-1"></i> Simpan & Jalankan Prediksi ML
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
